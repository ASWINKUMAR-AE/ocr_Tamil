<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tamil OCR Web Client Integration</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #2d3748; }
    h1 { color: #1a365d; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
    button { background: #2b6cb0; color: #fff; font-size: 16px; font-weight: 600; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #2c5282; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .result-box { margin-top: 24px; background: #edf2f7; padding: 18px; border-radius: 6px; }
    .tamil-output { font-size: 1.25rem; font-family: "Noto Sans Tamil", "Latha", sans-serif; white-space: pre-wrap; background: #fff; padding: 15px; border-radius: 6px; border-left: 4px solid #3182ce; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #fff; }
    th, td { border: 1px solid #cbd5e0; padding: 10px; text-align: left; }
    th { background: #ebf8ff; color: #2b6cb0; }
    .error { color: #e53e3e; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Tamil OCR Web Client</h1>
  <p>Upload an image containing Tamil or mixed-language text / tables.</p>

  <div class="card">
    <div class="form-group">
      <label for="serverUrl">OCR API Server URL (LAN IP & Port):</label>
      <input type="text" id="serverUrl" value="http://10.110.44.105:8000">
    </div>

    <div class="form-group">
      <label for="apiKey">API Key (optional if enabled on server):</label>
      <input type="text" id="apiKey" placeholder="Leave blank if server has no API_KEY configured">
    </div>

    <div class="form-group">
      <label for="imageFile">Select Tamil Image (JPEG, PNG, WebP):</label>
      <input type="file" id="imageFile" accept="image/jpeg,image/png,image/webp">
    </div>

    <div class="form-group">
      <label><input type="checkbox" id="extractTables" checked> Extract Tables (if present)</label>
      &nbsp;&nbsp;
      <label><input type="checkbox" id="preprocess" checked> Apply Preprocessing</label>
    </div>

    <button id="submitBtn" onclick="runOCR()">Extract Tamil Text</button>

    <div id="statusMsg" style="margin-top: 15px;"></div>

    <div id="resultContainer" class="result-box" style="display:none;">
      <h3>Recognized Text</h3>
      <div id="tamilTextOutput" class="tamil-output"></div>

      <div id="tableSection" style="margin-top: 20px; display:none;">
        <h3>Structured Tables</h3>
        <div id="tableOutput"></div>
      </div>

      <div id="metaOutput" style="margin-top: 15px; font-size: 0.85rem; color: #718096;"></div>
    </div>
  </div>

  <script>
    async function runOCR() {
      const serverUrl = document.getElementById('serverUrl').value.replace(/\/+$/, '');
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageFile');
      const extractTables = document.getElementById('extractTables').checked;
      const preprocess = document.getElementById('preprocess').checked;
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      const resultContainer = document.getElementById('resultContainer');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert("Please select an image file first.");
        return;
      }

      submitBtn.disabled = true;
      statusMsg.innerHTML = "Processing image with Tamil OCR engine...";
      resultContainer.style.display = "none";

      try {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('extract_tables', extractTables ? 'true' : 'false');
        formData.append('preprocess', preprocess ? 'true' : 'false');

        const headers = { 'Accept': 'application/json' };
        if (apiKey) {
          headers['X-API-Key'] = apiKey;
        }

        const response = await fetch(`${serverUrl}/api/v1/ocr`, {
          method: 'POST',
          headers: headers,
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        statusMsg.innerHTML = "<span style='color: #38a169;'>Extraction completed successfully!</span>";

        // Display text
        document.getElementById('tamilTextOutput').innerText = data.extracted_text || "(No text recognized)";

        // Display tables if present
        const tableSection = document.getElementById('tableSection');
        const tableOutput = document.getElementById('tableOutput');
        tableOutput.innerHTML = "";

        if (data.tables && data.tables.length > 0) {
          tableSection.style.display = "block";
          data.tables.forEach((tbl, idx) => {
            let html = `<h4>Table #${idx + 1} (${tbl.row_count} rows, ${tbl.column_count} columns)</h4><table><thead><tr>`;
            tbl.headers.forEach(h => { html += `<th>${h}</th>`; });
            html += `</tr></thead><tbody>`;
            tbl.rows.forEach(r => {
              html += `<tr>`;
              r.forEach(c => { html += `<td>${c}</td>`; });
              html += `</tr>`;
            });
            html += `</tbody></table>`;
            tableOutput.innerHTML += html;
          });
        } else {
          tableSection.style.display = "none";
        }

        // Display metadata
        document.getElementById('metaOutput').innerText = 
          `Engine: ${data.metadata.ocr_engine} | Processing Time: ${data.metadata.processing_time_ms} ms | Request ID: ${data.request_id}`;

        resultContainer.style.display = "block";

      } catch (err) {
        statusMsg.innerHTML = `<span class="error">Error: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
